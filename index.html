<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Immaculate C. Ogbuagu — Software Engineer & Applied AI Researcher</title>
  <meta name="description" content="Portfolio of Immaculate Chidimma Ogbuagu: software engineer, lecturer and applied AI researcher building AI, machine learning and NLP tools for health and food security.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash
    try {
      var t = localStorage.getItem("theme");
      if (t) document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#top" id="brand"></a>
      <nav class="nav" id="nav" aria-label="Sections"></nav>
      <div class="topbar-actions">
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle light and dark theme"></button>
        <button class="icon-btn menu-btn" id="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false"></button>
      </div>
    </div>
  </header>

  <div class="layout" id="top">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="content" id="content">
      <section class="hero" id="hero"></section>
    </main>
  </div>

  <footer class="footer" id="footer"></footer>

  <script src="data.js"></script>
  <script src="main.js"></script>
</body>
</html>
